server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は自己署名です
  ssl_certificate     /etc/nginx/tls/dummy.crt;
  ssl_certificate_key /etc/nginx/tls/dummy.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

# Go アプリは別の台で動く（app1）。ホスト名 app1 は各台の /etc/hosts で解決する。
# 同一ホストで動かす場合に戻すなら、upstream ごと http://localhost:8080 に置き換える。
# upstream は http コンテキストにしか書けないので、server ブロックの外に置く。
# keepalive はアプリへの接続を使い回す数。location 側で proxy_http_version 1.1 と
# Connection "" を指定しないと効かない（既定の HTTP/1.0 だと毎回接続を張り直す）。
upstream isuride_go {
  server app1:8080;
  keepalive 512;
}

server {
  listen 443 ssl;
  server_name xiv.isucon.net;
  server_name *.xiv.isucon.net;

  ssl_certificate     /etc/nginx/tls/_.xiv.isucon.net.crt;
  ssl_certificate_key /etc/nginx/tls/_.xiv.isucon.net.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  # ベンチからの接続を使い回す。既定の 1000 リクエストで切ると、椅子の座標送信のように
  # 1 本の接続に大量のリクエストが来る場合に、閉じた直後の接続へ送って EOF になることがある。
  keepalive_requests 10000;
  keepalive_timeout 120s;

  # 静的ファイルの圧縮。gzip は既定で text/html しか対象にならないので、js/css/svg などを明示する。
  # location /api/ では gzip off にする(下の location を参照)。
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/css text/plain text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;
  # BEGIN pprotein-measure (Ansible が管理。手で編集しない)
  access_log /var/log/nginx/access.log ltsv;
  # END pprotein-measure (Ansible が管理。手で編集しない)

  # 静的ファイルはアプリに投げず、この nginx がディスクから返す。
  # /api/ はアプリ、それ以外は根こそぎ静的ファイル扱いにする（アプリへ到達させない）。
  #
  # gzip off で API のレスポンスは圧縮しない。Accept-Encoding を送らないクライアント
  # (またはデコードしないクライアント)に gzip 本文を返すと、JSON の先頭が 1f 8b になり
  # ベンチマーカーが invalid character '\x1f' で失敗する。圧縮するのは静的ファイルだけにする。
  location /api/ {
    gzip off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isuride_go;
  }

  location /api/internal/ {
    # localhostからのみアクセスを許可
    allow 127.0.0.1;
    deny all;
    gzip off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://isuride_go;
  }

  # Rspack のビルド名は [name]-[contenthash].js で、内容が変われば名前も変わる。
  # ブラウザにキャッシュさせて再検証のリクエスト自体を減らす。
  # expires は add_header を消して Cache-Control を自前で付けるので、expires は使わない。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # アイコン類もファイル名が固定で内容が変わらない。
  location ~* ^/(favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon-\d+x\d+\.png)$ {
    add_header Cache-Control "public, max-age=86400";
    access_log off;
  }

  # 画像は内容が頻繁に変わらないので1週間キャッシュさせる。
  location /images/ {
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # SPA の各ルートは index.html を返す。index.html は再デプロイで中身が変わるので毎回検証させる。
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
