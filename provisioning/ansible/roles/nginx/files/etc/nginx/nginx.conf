user www-data;
worker_processes auto;
# 1 つの worker が開けるファイルの数。接続 1 本ごとに 1 つ使うので、worker_connections より多くする
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
# warn は、接続の数が上限に近づいて待機中の接続を閉じたとき（"worker_connections are not enough"）に出る。
# 既定（error）だと残らないので warn から残す
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
	# ベンチからの接続と、アプリへの接続の合計で数える。SSE の通知は椅子・ユーザーごとに両方を張りっぱなしにし、
	# 既定の 768 では終盤に足りなくなった（待機中の接続が閉じられ、ベンチ側で EOF になる）
	worker_connections 16384;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
