server {
  listen 80 default_server;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  # 静的ファイルの圧縮。gzip は既定で text/html しか対象にならないので、js/css/svg などを明示する。
  # location /api/ では gzip off にする(下の location を参照)。
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/css text/plain text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;

  # 静的ファイルはアプリに投げず、この nginx がディスクから返す。
  # /api/ はアプリ、それ以外は根こそぎ静的ファイル扱いにする（アプリへ到達させない）。
  #
  # gzip off で API のレスポンスは圧縮しない。Accept-Encoding を送らないクライアント
  # (またはデコードしないクライアント)に gzip 本文を返すと、JSON の先頭が 1f 8b になり
  # ベンチマーカーが invalid character '\x1f' で失敗する。圧縮するのは静的ファイルだけにする。
  location /api/ {
    gzip off;
    proxy_set_header Host $host;
    proxy_pass http://webapp:8080;
  }

  location /api/internal/ {
    # dockerからのみアクセスを許可
    allow 172.16.0.0/12;
    deny all;
    gzip off;
    proxy_set_header Host $host;
    proxy_pass http://webapp:8080;
  }

  # Rspack のビルド名は [name]-[contenthash].js で、内容が変われば名前も変わる。
  # ブラウザにキャッシュさせて再検証のリクエスト自体を減らす。
  # expires は add_header を消して Cache-Control を自前で付けるので、expires は使わない。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # アイコン類もファイル名が固定で内容が変わらない。
  location ~* ^/(favicon\.ico|favicon-\d+x\d+\.png|apple-touch-icon-\d+x\d+\.png)$ {
    add_header Cache-Control "public, max-age=86400";
    access_log off;
  }

  # 画像は内容が頻繁に変わらないので1週間キャッシュさせる。
  location /images/ {
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # SPA の各ルートは index.html を返す。index.html は再デプロイで中身が変わるので毎回検証させる。
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
